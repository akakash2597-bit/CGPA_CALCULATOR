<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= WELCOME SCREEN ================= -->

<section id="welcomeScreen" class="screen active">

    <div class="card">

        <h1>CGPA Calculator</h1>

        <p>
            Calculate your CGPA accurately using the
            Rajalakshmi Institute of Technology grading system.
        </p>

        <button id="startBtn">
            Start Calculating
        </button>

    </div>

</section>

<!-- ================= CALCULATOR SCREEN ================= -->

<section id="calculatorScreen" class="screen">

    <div class="calculator-card">

        <h2>CGPA Calculator</h2>

        <div class="progress">

            <div class="active-step">1</div>
            <div class="line"></div>
            <div class="active-step">2</div>
            <div class="line"></div>
            <div>3</div>

        </div>

        <div class="formula">

            CGPA =
            Σ(Credit × Grade Point)
            ÷
            Σ(Credits)

        </div>

        <div id="subjects">

            <div class="subject">

                <input
                    type="text"
                    placeholder="Subject Name">

                <input
                    type="number"
                    placeholder="Credits">

                <select>

                    <option>O</option>
                    <option>A+</option>
                    <option>A</option>
                    <option>B+</option>
                    <option>B</option>
                    <option>C</option>
                    <option>RA</option>

                </select>

            </div>

        </div>

        <button id="addSubject">
            + Add Subject
        </button>

        <div class="buttons">

            <button id="resetBtn">
                Reset
            </button>

            <button id="calculateBtn">
                Calculate CGPA
            </button>

        </div>

    </div>

</section>

<!-- ================= RESULT SCREEN ================= -->

<section id="resultScreen" class="screen">

    <div class="card">

        <h2>Result Screen</h2>

        <p>
            Coming in Step 3...
        </p>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
